<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임운영 공고판</title>
<meta name="description" content="게임잡에 최근 2주간 올라온 경력무관 게임운영 공고를 마감 D-day 순으로 모아 본 목록입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: 한 줄 요약 → 필터 → 마감 D-day가 왼쪽에 붙은 공고 목록 (폰에서는 세로로 쌓임) */
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --fg: #17202e;
    --muted: #5c6879;
    --line: #dde3eb;
    --accent: #2f4fc4;
    --accent-soft: #e6ebfa;
    --urgent: #c2362b;
    --urgent-soft: #fbe7e5;
    --soon: #9a6200;
    --soon-soft: #fbf0d9;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141b; --surface: #181e28; --fg: #e6eaf1; --muted: #98a3b4; --line: #2a3240;
      --accent: #8ea6ff; --accent-soft: #232d4d; --urgent: #ff8a7f; --urgent-soft: #3d1f1d;
      --soon: #f0c06a; --soon-soft: #3a2e17; color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
    font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 880px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 56px;
    display: grid; gap: 24px;
  }
  header { display: grid; gap: 6px; }
  .eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
  .summary { margin: 4px 0 0; color: var(--muted); }
  .summary strong { color: var(--fg); }
  .summary .hot { color: var(--urgent); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .chips, .sort { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
  .sort .chip { font-size: 13px; padding: 5px 10px; }
  .chip:focus-visible, .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .job {
    display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 16px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .dday {
    font-family: var(--font-mono); font-weight: 600; font-size: 15px; text-align: center;
    padding: 8px 0; border-radius: 6px; background: var(--bg); color: var(--muted);
    font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .dday small { display: block; font-size: 11px; font-weight: 500; margin-top: 2px; }
  .dday.urgent { background: var(--urgent-soft); color: var(--urgent); }
  .dday.soon { background: var(--soon-soft); color: var(--soon); }
  .dday.open { font-family: var(--font-body); font-size: 13px; font-weight: 500; }
  .body { min-width: 0; display: grid; gap: 4px; }
  .co { font-size: 13px; color: var(--muted); }
  .title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 2px; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); }
  .tag.kind { background: var(--accent-soft); color: var(--accent); }
  .tag.warn { background: var(--soon-soft); color: var(--soon); }
  .go {
    color: var(--accent); text-decoration: none; font-weight: 500; font-size: 14px; white-space: nowrap;
    border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px;
  }
  .go:hover { background: var(--accent-soft); }

  .notes { display: grid; gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  .notes p { margin: 0; max-width: 68ch; }
  .notes a { color: var(--accent); }

  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    .job { grid-template-columns: 60px minmax(0, 1fr); gap: 12px; }
    .go { grid-column: 1 / -1; text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">게임잡 · 게임운영 · 경력무관 · 최근 14일 등록 · <span id="updated"></span></div>
    <h1>게임운영 공고판</h1>
    <p class="summary" id="summary">공고를 불러오는 중입니다.</p>
  </header>

  <div class="controls">
    <div class="chips" id="filters" role="group" aria-label="공고 묶음"></div>
    <div class="sort" role="group" aria-label="정렬">
      <button class="chip" id="sort-deadline" data-sort="deadline" aria-pressed="true">마감 빠른 순</button>
      <button class="chip" id="sort-new" data-sort="new" aria-pressed="false">최근 등록 순</button>
    </div>
  </div>

  <ul class="list" id="list"></ul>

  <div class="notes">
    <p>매일 아침 9시에 게임잡에서 자동으로 다시 가져옵니다. 묶음(운영 중심 / 외국어 / 기획·PM)은 공고 제목의 단어로 자동 분류해서 가끔 틀릴 수 있습니다. 마감일과 내용은 바뀔 수 있으니 지원 전에 공고 원문을 꼭 확인하세요.</p>
    <p>파견직은 인력회사(그린맨파워, 휴머니아)에 소속되어 게임회사에서 일하는 형태입니다. 급여와 계약 조건이 정규직과 다를 수 있습니다.</p>
    <p>원본 목록: <a href="https://www.gamejob.co.kr/Recruit/joblist?menucode=duty" target="_blank" rel="noopener">게임잡 직종별 채용정보</a></p>
  </div>
</div>

<script>
  const KINDS = { ops: "운영 중심", lang: "운영 + 외국어", plan: "기획·PM 위주" };
  // 아래 JOBS:START ~ JOBS:END 사이는 scripts/update.py가 매일 새로 채웁니다.
  /* JOBS:START */
  const UPDATED = "2026-10-16 17:55";
  const JOBS = [
    {"id": 285989, "kind": "ops", "co": "휴머니아", "title": "[마포상암/성과급지급] 글로벌게임사 게임QA테스터 채용", "type": "파견직", "loc": "서울 마포구", "edu": "고졸 이상", "reg": "2026-10-16", "end": "2026-10-21", "careerNote": false},
    {"id": 285909, "kind": "plan", "co": "㈜토스트", "title": "겜성있는 인디게임 기획자를 찾습니다", "type": "정규직, 계약직, 아르바이트", "loc": "대구 동구", "edu": "학력무관", "reg": "2026-10-15", "end": "2026-10-31", "careerNote": false},
    {"id": 285877, "kind": "plan", "co": "티쓰리엔터테인먼트", "title": "[오디션팀] 글로벌 개발 PM 채용", "type": "정규직", "loc": "서울 금천구", "edu": "학력무관", "reg": "2026-10-14", "end": null, "careerNote": false},
    {"id": 285857, "kind": "ops", "co": "휴먼웍스", "title": "게임 운영 및 기획자 채용", "type": "정규직, 계약직", "loc": "서울 강남구", "edu": "고졸 이상", "reg": "2026-10-13", "end": "2026-10-18", "careerNote": false},
    {"id": 285856, "kind": "ops", "co": "게임엔", "title": "게임 운영 및 기획자 채용", "type": "정규직, 계약직, 병역특례", "loc": "서울 강남구", "edu": "고졸 이상", "reg": "2026-10-13", "end": "2026-10-22", "careerNote": false},
    {"id": 285840, "kind": "ops", "co": "㈜그린맨파워", "title": "[마포구/상암] 유명 장수형 MMORPG 게임운영(GM)채용", "type": "파견직", "loc": "서울 마포구", "edu": "학력무관", "reg": "2026-10-13", "end": "2026-11-13", "careerNote": false},
    {"id": 285812, "kind": "ops", "co": "휴머니아", "title": "[마포상암/인센티브] 글로벌게임사 게임운영(GM) 채용", "type": "파견직", "loc": "서울 마포구", "edu": "고졸 이상", "reg": "2026-10-12", "end": "2026-10-19", "careerNote": false},
    {"id": 285730, "kind": "plan", "co": "인플루전", "title": "개발 PM 채용", "type": "정규직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-09", "end": null, "careerNote": false},
    {"id": 285720, "kind": "ops", "co": "스타픽시스튜디오", "title": "[메이플스타/MSW] 게임 서비스 운영 직군", "type": "정규직", "loc": "경기 용인시", "edu": "학력무관", "reg": "2026-10-09", "end": "2026-11-08", "careerNote": false},
    {"id": 285694, "kind": "lang", "co": "㈜네오위즈", "title": "[네오위즈] 중국어(번체) Linguist (계약직)", "type": "계약직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-08", "end": null, "careerNote": false},
    {"id": 285691, "kind": "lang", "co": "㈜네오위즈", "title": "[네오위즈] 중국어(간체) Linguist (계약직)", "type": "계약직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-08", "end": null, "careerNote": false},
    {"id": 285689, "kind": "lang", "co": "㈜네오위즈", "title": "[네오위즈] 영어 Linguist (계약직)", "type": "계약직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-08", "end": null, "careerNote": false},
    {"id": 285677, "kind": "plan", "co": "㈜디벨로켓", "title": "[넥스코어] 게임 기획자(시스템, 컨텐츠) 모집", "type": "계약직", "loc": "경기, 서울", "edu": "학력무관", "reg": "2026-10-08", "end": "2026-12-08", "careerNote": false},
    {"id": 285600, "kind": "lang", "co": "게임덱스", "title": "[영어] 게임 현지화 파트 번역/검수 담당 - 한영/영한 번역 가능자 (계약직)", "type": "계약직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-07", "end": null, "careerNote": false},
    {"id": 285537, "kind": "ops", "co": "㈜그린맨파워", "title": "[판교] 국내 대형게임사 모니터링 담당 채용", "type": "파견직", "loc": "경기 성남시", "edu": "학력무관", "reg": "2026-10-02", "end": null, "careerNote": false},
  ];
  /* JOBS:END */

  const DAY = 86400000;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const daysLeft = j => j.end ? Math.round((toDate(j.end) - today) / DAY) : null;
  const fmt = s => s.slice(5).replace("-", "/");

  let state = { kind: "all", sort: "deadline" };
  try { const s = JSON.parse(localStorage.getItem("gj-view") || "null"); if (s) state = { ...state, ...s }; } catch (e) {}
  const save = () => { try { localStorage.setItem("gj-view", JSON.stringify(state)); } catch (e) {} };

  function ddayCell(j) {
    const n = daysLeft(j);
    if (n === null) return `<div class="dday open">상시<small>채용시 마감</small></div>`;
    if (n < 0) return `<div class="dday">마감<small>${fmt(j.end)}</small></div>`;
    const cls = n <= 3 ? "urgent" : n <= 10 ? "soon" : "";
    return `<div class="dday ${cls}">${n === 0 ? "D-DAY" : "D-" + n}<small>~${fmt(j.end)}</small></div>`;
  }

  function render() {
    const f = document.getElementById("filters");
    const counts = { all: JOBS.length };
    JOBS.forEach(j => counts[j.kind] = (counts[j.kind] || 0) + 1);
    f.innerHTML = [["all", "전체"], ...Object.entries(KINDS)].map(([k, label]) =>
      `<button class="chip" id="filter-${k}" data-kind="${k}" aria-pressed="${state.kind === k}">${label}<span class="n">${counts[k] || 0}</span></button>`
    ).join("");

    document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === state.sort));

    const rows = JOBS.filter(j => state.kind === "all" || j.kind === state.kind).slice().sort((a, b) => {
      if (state.sort === "new") return toDate(b.reg) - toDate(a.reg);
      const da = daysLeft(a), db = daysLeft(b);
      return (da === null ? 9999 : da < 0 ? 10000 : da) - (db === null ? 9999 : db < 0 ? 10000 : db);
    });

    document.getElementById("list").innerHTML = rows.map(j => `
      <li class="job">
        ${ddayCell(j)}
        <div class="body">
          <div class="co">${j.co} · ${fmt(j.reg)} 등록</div>
          <div class="title">${j.title}</div>
          <div class="meta">
            <span class="tag kind">${KINDS[j.kind]}</span>
            <span class="tag${j.type.includes("파견") ? " warn" : ""}">${j.type}</span>
            <span class="tag">${j.loc}</span>
            <span class="tag">${j.edu}</span>
            ${j.careerNote ? `<span class="tag warn">제목에 경력 조건 있음</span>` : ""}
          </div>
        </div>
        <a class="go" href="https://www.gamejob.co.kr/Recruit/GI_Read/View?GI_No=${j.id}" target="_blank" rel="noopener">공고 보기 ↗</a>
      </li>`).join("");

    document.getElementById("updated").textContent = UPDATED ? `${UPDATED} 갱신` : "";
    if (!JOBS.length) { document.getElementById("summary").textContent = "최근 14일 동안 올라온 공고가 없습니다."; return; }
    const hot = JOBS.filter(j => { const n = daysLeft(j); return n !== null && n >= 0 && n <= 3; });
    document.getElementById("summary").innerHTML = `공고 <strong>${JOBS.length}건</strong>` +
      (hot.length ? ` · <strong class="hot">3일 안에 마감 ${hot.length}건</strong> (${hot.map(j => j.co).join(", ")})` : "");
  }

  document.addEventListener("click", e => {
    const k = e.target.closest("[data-kind]"), s = e.target.closest("[data-sort]");
    if (k) state.kind = k.dataset.kind;
    else if (s) state.sort = s.dataset.sort;
    else return;
    save(); render();
  });
  render();
</script>
</body>
</html>
