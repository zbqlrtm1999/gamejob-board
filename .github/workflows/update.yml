name: 공고 매일 업데이트

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 한국 시간 오전 9시
  workflow_dispatch:       # Actions 탭에서 "Run workflow"로 바로 실행할 수도 있음

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게임잡에서 공고 가져오기
        run: python scripts/update.py

      - name: 바뀐 내용 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "공고 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
